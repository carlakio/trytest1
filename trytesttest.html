<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f8f5f2;
            padding: 20px;
        }

        .card-wrapper {
            perspective: 2000px;
            width: 800px;
            max-width: 95vw;
            height: 550px;
            aspect-ratio: 1.45 / 1;
        }

        .card {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .card.open {
            transform: translateX(-50%);
        }

        .card-side {
            position: absolute;
            width: 50%;
            height: 100%;
            background: white;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.12);
        }

        .card-left {
            left: 0;
            transform-origin: right center;
            transition: transform 1.2s cubic-bezier(0.4, 0.0, 0.2, 1);
            cursor: pointer;
            z-index: 2;
        }

        .card.open .card-left {
            transform: rotateY(-165deg);
        }

        .card-right {
            right: 0;
            left: 50%;
            opacity: 0;
            transition: opacity 0.3s ease 0.6s;
        }

        .card.open .card-right {
            opacity: 1;
        }

        .card-content {
            width: 100%;
            height: 100%;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Front Cover Styling */
        .front-cover {
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffffff 0%, #fefcfb 100%);
            border-right: 1px solid #f0e9e3;
        }

        .cover-title {
            font-size: 2.8em;
            color: #8b7355;
            letter-spacing: 3px;
            text-align: center;
            font-weight: 300;
            margin-bottom: 30px;
            line-height: 1.3;
        }

        .cover-subtitle {
            font-size: 1.1em;
            color: #a89080;
            text-align: center;
            font-style: italic;
            font-weight: 300;
        }

        /* Daisy Illustrations */
        .daisy-decoration {
            position: absolute;
        }

        .daisy-top-left {
            top: 30px;
            left: 30px;
            width: 80px;
            height: 80px;
        }

        .daisy-bottom-right {
            bottom: 30px;
            right: 30px;
            width: 100px;
            height: 100px;
            opacity: 0.9;
        }

        .daisy-cluster {
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: 90px;
            opacity: 0.85;
        }

        /* Realistic Daisy SVG */
        .daisy-svg {
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.08));
        }

        /* Inside Right Page */
        .inside-page {
            background: #fffefb;
        }

        .letter-header {
            font-size: 1.8em;
            color: #8b7355;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .letter-content {
            flex: 1;
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            font-size: 1.15em;
            line-height: 1.8;
            color: #4a4a4a;
            padding: 15px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .signature-line {
            text-align: right;
            font-size: 1.1em;
            color: #8b7355;
            font-style: italic;
            margin-top: 20px;
            padding-right: 15px;
        }

        /* Open Instruction */
        .open-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85em;
            color: #a89080;
            opacity: 0.7;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .card.open .open-hint {
            opacity: 0;
        }

        /* Decorative elements on right page */
        .daisy-corner-right {
            top: 20px;
            right: 25px;
            width: 70px;
            height: 70px;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .card-wrapper {
                height: auto;
                max-width: 100vw;
            }

            .card-content {
                padding: 30px 20px;
            }

            .cover-title {
                font-size: 1.8em;
                margin-bottom: 20px;
            }

            .cover-subtitle {
                font-size: 0.95em;
            }

            .letter-header {
                font-size: 1.3em;
                margin-bottom: 15px;
            }

            .letter-content {
                font-size: 0.95em;
                line-height: 1.6;
                padding: 10px;
            }

            .signature-line {
                font-size: 0.95em;
                margin-top: 15px;
                padding-right: 10px;
            }

            .daisy-top-left {
                width: 50px;
                height: 50px;
                top: 15px;
                left: 15px;
            }

            .daisy-bottom-right {
                display: none;
            }

            .daisy-cluster {
                width: 80px;
                height: 60px;
                bottom: 10px;
                left: 10px;
            }

            .open-hint {
                font-size: 0.75em;
                bottom: 15px;
            }

            .close-button {
                width: 28px;
                height: 28px;
                font-size: 1.1em;
                top: 12px;
                right: 12px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
                align-items: flex-start;
                padding-top: 20px;
            }

            .card-wrapper {
                width: 100%;
                max-width: 100vw;
            }

            .card-content {
                padding: 20px 15px;
            }

            .cover-title {
                font-size: 1.5em;
                margin-bottom: 15px;
                letter-spacing: 1px;
            }

            .cover-subtitle {
                font-size: 0.85em;
            }

            .letter-header {
                font-size: 1.1em;
                margin-bottom: 12px;
            }

            .letter-content {
                font-size: 0.85em;
                line-height: 1.5;
                padding: 8px;
                overflow-y: auto;
                max-height: 200px;
            }

            .signature-line {
                font-size: 0.85em;
                margin-top: 12px;
                padding-right: 8px;
            }

            .daisy-top-left {
                width: 35px;
                height: 35px;
                top: 10px;
                left: 10px;
            }

            .daisy-cluster {
                display: none;
            }

            .open-hint {
                font-size: 0.65em;
                bottom: 10px;
            }

            .close-button {
                width: 24px;
                height: 24px;
                font-size: 0.95em;
                top: 10px;
                right: 10px;
            }
        }

        @media (max-width: 360px) {
            .card-content {
                padding: 15px 12px;
            }

            .cover-title {
                font-size: 1.3em;
                margin-bottom: 10px;
                letter-spacing: 1px;
            }

            .daisy-top-left {
                width: 30px;
                height: 30px;
                top: 8px;
                left: 8px;
            }

            .letter-header {
                font-size: 1em;
            }

            .letter-content {
                font-size: 0.8em;
                max-height: 180px;
            }
        }

        /* Close button */
        .close-button {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 32px;
            height: 32px;
            border: 1.5px solid #8b7355;
            background: white;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3em;
            color: #8b7355;
            transition: all 0.3s;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
        }

        .card.open .close-button {
            opacity: 1;
            pointer-events: auto;
        }

        .close-button:hover {
            background: #8b7355;
            color: white;
            transform: rotate(90deg);
        }
    </style>
</head>
<body>
    <div class="card-wrapper">
        <div class="card" id="card">
            <!-- Left Side (Front Cover) -->
            <div class="card-side card-left" id="cardLeft">
                <div class="card-content front-cover">
                    <!-- Daisy decorations -->
                    <div class="daisy-decoration daisy-top-left">
                        <svg class="daisy-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <radialGradient id="petal-grad-1" cx="50%" cy="30%">
                                    <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
                                    <stop offset="70%" style="stop-color:#fefefe;stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:#f5f5f5;stop-opacity:1" />
                                </radialGradient>
                                <radialGradient id="center-grad-1" cx="50%" cy="50%">
                                    <stop offset="0%" style="stop-color:#ffd35c;stop-opacity:1" />
                                    <stop offset="50%" style="stop-color:#f4c430;stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:#d4a017;stop-opacity:1" />
                                </radialGradient>
                            </defs>
                            <!-- Petals -->
                            <ellipse cx="50" cy="18" rx="7" ry="15" fill="url(#petal-grad-1)" stroke="#e8e8e8" stroke-width="0.3"/>
                            <ellipse cx="50" cy="82" rx="7" ry="15" fill="url(#petal-grad-1)" stroke="#e8e8e8" stroke-width="0.3"/>
                            <ellipse cx="18" cy="50" rx="15" ry="7" fill="url(#petal-grad-1)" stroke="#e8e8e8" stroke-width="0.3"/>
                            <ellipse cx="82" cy="50" rx="15" ry="7" fill="url(#petal-grad-1)" stroke="#e8e8e8" stroke-width="0.3"/>
                            <ellipse cx="28" cy="28" rx="11" ry="11" fill="url(#petal-grad-1)" stroke="#e8e8e8" stroke-width="0.3" transform="rotate(-45 28 28)"/>
                            <ellipse cx="72" cy="28" rx="11" ry="11" fill="url(#petal-grad-1)" stroke="#e8e8e8" stroke-width="0.3" transform="rotate(45 72 28)"/>
                            <ellipse cx="28" cy="72" rx="11" ry="11" fill="url(#petal-grad-1)" stroke="#e8e8e8" stroke-width="0.3" transform="rotate(45 28 72)"/>
                            <ellipse cx="72" cy="72" rx="11" ry="11" fill="url(#petal-grad-1)" stroke="#e8e8e8" stroke-width="0.3" transform="rotate(-45 72 72)"/>
                            <!-- Center -->
                            <circle cx="50" cy="50" r="13" fill="url(#center-grad-1)"/>
                            <circle cx="50" cy="50" r="13" fill="none" stroke="#d4a017" stroke-width="0.5"/>
                            <!-- Texture dots on center -->
                            <circle cx="48" cy="48" r="0.8" fill="#c89000" opacity="0.6"/>
                            <circle cx="53" cy="47" r="0.7" fill="#c89000" opacity="0.5"/>
                            <circle cx="51" cy="52" r="0.9" fill="#c89000" opacity="0.6"/>
                            <circle cx="47" cy="53" r="0.7" fill="#c89000" opacity="0.5"/>
                            <circle cx="54" cy="51" r="0.6" fill="#c89000" opacity="0.4"/>
                        </svg>
                    </div>

                    <div class="daisy-decoration daisy-bottom-right">
                        <svg class="daisy-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <radialGradient id="petal-grad-2" cx="50%" cy="30%">
                                    <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
                                    <stop offset="70%" style="stop-color:#fefefe;stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:#f5f5f5;stop-opacity:1" />
                                </radialGradient>
                                <radialGradient id="center-grad-2" cx="50%" cy="50%">
                                    <stop offset="0%" style="stop-color:#ffd35c;stop-opacity:1" />
                                    <stop offset="50%" style="stop-color:#f4c430;stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:#d4a017;stop-opacity:1" />
                                </radialGradient>
                            </defs>
                            <ellipse cx="50" cy="18" rx="7" ry="15" fill="url(#petal-grad-2)" stroke="#e8e8e8" stroke-width="0.3"/>
                            <ellipse cx="50" cy="82" rx="7" ry="15" fill="url(#petal-grad-2)" stroke="#e8e8e8" stroke-width="0.3"/>
                            <ellipse cx="18" cy="50" rx="15" ry="7" fill="url(#petal-grad-2)" stroke="#e8e8e8" stroke-width="0.3"/>
                            <ellipse cx="82" cy="50" rx="15" ry="7" fill="url(#petal-grad-2)" stroke="#e8e8e8" stroke-width="0.3"/>
                            <ellipse cx="28" cy="28" rx="11" ry="11" fill="url(#petal-grad-2)" stroke="#e8e8e8" stroke-width="0.3" transform="rotate(-45 28 28)"/>
                            <ellipse cx="72" cy="28" rx="11" ry="11" fill="url(#petal-grad-2)" stroke="#e8e8e8" stroke-width="0.3" transform="rotate(45 72 28)"/>
                            <ellipse cx="28" cy="72" rx="11" ry="11" fill="url(#petal-grad-2)" stroke="#e8e8e8" stroke-width="0.3" transform="rotate(45 28 72)"/>
                            <ellipse cx="72" cy="72" rx="11" ry="11" fill="url(#petal-grad-2)" stroke="#e8e8e8" stroke-width="0.3" transform="rotate(-45 72 72)"/>
                            <circle cx="50" cy="50" r="13" fill="url(#center-grad-2)"/>
                            <circle cx="50" cy="50" r="13" fill="none" stroke="#d4a017" stroke-width="0.5"/>
                            <circle cx="48" cy="48" r="0.8" fill="#c89000" opacity="0.6"/>
                            <circle cx="53" cy="47" r="0.7" fill="#c89000" opacity="0.5"/>
                            <circle cx="51" cy="52" r="0.9" fill="#c89000" opacity="0.6"/>
                            <circle cx="47" cy="53" r="0.7" fill="#c89000" opacity="0.5"/>
                            <circle cx="54" cy="51" r="0.6" fill="#c89000" opacity="0.4"/>
                        </svg>
                    </div>

                    <div class="cover-title">
                        Felice<br>San Valentino Senna
                    </div>
                    <div class="cover-subtitle">apri per leggere la mia lettera</div>
                    <div class="open-hint">clicca per aprire →</div>
                </div>
            </div>

            <!-- Right Side (Inside Page) -->
            <div class="card-side card-right">
                <div class="card-content inside-page">
                    <button class="close-button" id="closeBtn" title="Close card">×</button>
                    
                    <div class="daisy-decoration daisy-cluster">
                        <svg class="daisy-svg" viewBox="0 0 140 100" xmlns="http://www.w3.org/2000/svg">
                            <!-- First daisy -->
                            <g transform="translate(25, 35) scale(0.7)">
                                <ellipse cx="50" cy="18" rx="6" ry="13" fill="url(#petal-grad-1)" stroke="#e8e8e8" stroke-width="0.3"/>
                                <ellipse cx="50" cy="82" rx="6" ry="13" fill="url(#petal-grad-1)" stroke="#e8e8e8" stroke-width="0.3"/>
                                <ellipse cx="18" cy="50" rx="13" ry="6" fill="url(#petal-grad-1)" stroke="#e8e8e8" stroke-width="0.3"/>
                                <ellipse cx="82" cy="50" rx="13" ry="6" fill="url(#petal-grad-1)" stroke="#e8e8e8" stroke-width="0.3"/>
                                <ellipse cx="28" cy="28" rx="10" ry="10" fill="url(#petal-grad-1)" stroke="#e8e8e8" stroke-width="0.3" transform="rotate(-45 28 28)"/>
                                <ellipse cx="72" cy="28" rx="10" ry="10" fill="url(#petal-grad-1)" stroke="#e8e8e8" stroke-width="0.3" transform="rotate(45 72 28)"/>
                                <ellipse cx="28" cy="72" rx="10" ry="10" fill="url(#petal-grad-1)" stroke="#e8e8e8" stroke-width="0.3" transform="rotate(45 28 72)"/>
                                <ellipse cx="72" cy="72" rx="10" ry="10" fill="url(#petal-grad-1)" stroke="#e8e8e8" stroke-width="0.3" transform="rotate(-45 72 72)"/>
                                <circle cx="50" cy="50" r="11" fill="url(#center-grad-1)"/>
                            </g>
                            <!-- Second daisy -->
                            <g transform="translate(65, 20) scale(0.6)">
                                <ellipse cx="50" cy="18" rx="6" ry="13" fill="url(#petal-grad-2)" stroke="#e8e8e8" stroke-width="0.3"/>
                                <ellipse cx="50" cy="82" rx="6" ry="13" fill="url(#petal-grad-2)" stroke="#e8e8e8" stroke-width="0.3"/>
                                <ellipse cx="18" cy="50" rx="13" ry="6" fill="url(#petal-grad-2)" stroke="#e8e8e8" stroke-width="0.3"/>
                                <ellipse cx="82" cy="50" rx="13" ry="6" fill="url(#petal-grad-2)" stroke="#e8e8e8" stroke-width="0.3"/>
                                <ellipse cx="28" cy="28" rx="10" ry="10" fill="url(#petal-grad-2)" stroke="#e8e8e8" stroke-width="0.3" transform="rotate(-45 28 28)"/>
                                <ellipse cx="72" cy="28" rx="10" ry="10" fill="url(#petal-grad-2)" stroke="#e8e8e8" stroke-width="0.3" transform="rotate(45 72 28)"/>
                                <ellipse cx="28" cy="72" rx="10" ry="10" fill="url(#petal-grad-2)" stroke="#e8e8e8" stroke-width="0.3" transform="rotate(45 28 72)"/>
                                <ellipse cx="72" cy="72" rx="10" ry="10" fill="url(#petal-grad-2)" stroke="#e8e8e8" stroke-width="0.3" transform="rotate(-45 72 72)"/>
                                <circle cx="50" cy="50" r="11" fill="url(#center-grad-2)"/>
                            </g>
                            <!-- Third daisy -->
                            <g transform="translate(50, 50) scale(0.5)">
                                <ellipse cx="50" cy="18" rx="6" ry="13" fill="url(#petal-grad-3)" stroke="#e8e8e8" stroke-width="0.3"/>
                                <ellipse cx="50" cy="82" rx="6" ry="13" fill="url(#petal-grad-3)" stroke="#e8e8e8" stroke-width="0.3"/>
                                <ellipse cx="18" cy="50" rx="13" ry="6" fill="url(#petal-grad-3)" stroke="#e8e8e8" stroke-width="0.3"/>
                                <ellipse cx="82" cy="50" rx="13" ry="6" fill="url(#petal-grad-3)" stroke="#e8e8e8" stroke-width="0.3"/>
                                <ellipse cx="28" cy="28" rx="10" ry="10" fill="url(#petal-grad-3)" stroke="#e8e8e8" stroke-width="0.3" transform="rotate(-45 28 28)"/>
                                <ellipse cx="72" cy="28" rx="10" ry="10" fill="url(#petal-grad-3)" stroke="#e8e8e8" stroke-width="0.3" transform="rotate(45 72 28)"/>
                                <ellipse cx="28" cy="72" rx="10" ry="10" fill="url(#petal-grad-3)" stroke="#e8e8e8" stroke-width="0.3" transform="rotate(45 28 72)"/>
                                <ellipse cx="72" cy="72" rx="10" ry="10" fill="url(#petal-grad-3)" stroke="#e8e8e8" stroke-width="0.3" transform="rotate(-45 72 72)"/>
                                <circle cx="50" cy="50" r="11" fill="url(#center-grad-3)"/>
                            </g>
                        </svg>
                    </div>

                    <h2 class="letter-header">Ciao</h2>
                    
                    
                    <div class="letter-content" id="letterContent">
Sono davvero felice di averti incontrato, fratello. Ti meriti tutto l'amore del mondo! Buon San Valentino e stammi bene!
                    </div>
                    
                    <div class="signature-line">akio</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const card = document.getElementById('card');
        const cardLeft = document.getElementById('cardLeft');
        const closeBtn = document.getElementById('closeBtn');

        // Open card
        cardLeft.addEventListener('click', () => {
            if (!card.classList.contains('open')) {
                card.classList.add('open');
            }
        });

        // Close card
        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            card.classList.remove('open');
        });
    </script>
</body>
</html>
